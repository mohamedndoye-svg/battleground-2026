name: Election night poller

# Each run keeps one job polling for ~5h40m, so GitHub's often-late cron only has to start a job, not drive each poll.
# The hourly schedule starts the next job; the concurrency group keeps exactly one poller running and one queued.
on:
  # Scheduled polling ended Nov 4, 2026 (no Georgia runoff). Run manually from the Actions tab if needed.
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long this run should poll (max ~340)'
        default: '340'

concurrency:
  group: election-night-poller
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Check out gh-pages into .pages (create it on first run)
        run: |
          git fetch origin gh-pages || true
          if git rev-parse --verify -q origin/gh-pages >/dev/null; then
            git worktree add .pages origin/gh-pages
            git -C .pages checkout -B gh-pages origin/gh-pages
          else
            git worktree add --detach .pages
            git -C .pages checkout --orphan gh-pages
            git -C .pages rm -rf -q . || true
          fi
          mkdir -p site/live logs
          # resume from the previous job's state (versions, last good results, health)
          cp .pages/live/state.json site/live/ 2>/dev/null || true
          cp .pages/live/secondary.json site/live/ 2>/dev/null || true

      - name: Poll official feeds and publish
        env:
          BG_LOG: ${{ github.workspace }}/logs/fetch.jsonl
        run: |
          MIN="${{ github.event.inputs.minutes || '340' }}"
          python -m live.poller --out site/live --duration "$MIN" \
            --publish-cmd "bash scripts/publish_pages.sh" --publish-every 360

      - name: Final publish
        if: always()
        run: bash scripts/publish_pages.sh || true

      - name: Keep the fetch log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-log-${{ github.run_id }}
          path: logs/fetch.jsonl
          retention-days: 30
