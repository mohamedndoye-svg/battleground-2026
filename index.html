<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Battleground 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky tab bar; each view is a single column of panels on phones, two columns of race cards on wide screens.
   Ink on cool paper, with party colours carrying all the meaning and one violet accent for "this year". */
:root {
  --bg: #f3f5f8; --surface: #ffffff; --sunk: #e9edf2; --ink: #17202a; --ink-2: #4a5563; --ink-3: #6b7685; --line: #d7dde5;
  --accent: #6a35b0; --accent-soft: #efe8fa;
  --dem: #1f5fb4; --dem-soft: #e3edfa; --dem-mid: #8fb2e3;
  --rep: #be2f28; --rep-soft: #fbe6e4; --rep-mid: #e79a94;
  --ind: #5b4fa6; --ind-soft: #ebe8f7;
  --toss: #8a6a12; --toss-soft: #f6eed7; --toss-mid: #d8bd6a;
  --warn: #9a5b00; --warn-soft: #fff1da;
  --c2026: #7A3FC2; --c2022: #B26A12;
  --focus: #6a35b0;
  --f-display: "IBM Plex Sans Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1419; --surface: #171e26; --sunk: #1e2731; --ink: #e7ecf2; --ink-2: #b4bfcb; --ink-3: #8b97a5; --line: #2b3643;
  --accent: #b08ef0; --accent-soft: #2a2140;
  --dem: #7aa9ea; --dem-soft: #17283f; --dem-mid: #3d6aa8;
  --rep: #f08a80; --rep-soft: #3a1c1b; --rep-mid: #a8463f;
  --ind: #a99cf0; --ind-soft: #262140;
  --toss: #dcb85a; --toss-soft: #322a14; --toss-mid: #8d7330;
  --warn: #f0b45a; --warn-soft: #33260f;
  --c2026: #9D6FE6; --c2022: #BE8126; --focus: #b08ef0; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1419; --surface: #171e26; --sunk: #1e2731; --ink: #e7ecf2; --ink-2: #b4bfcb; --ink-3: #8b97a5; --line: #2b3643;
  --accent: #b08ef0; --accent-soft: #2a2140;
  --dem: #7aa9ea; --dem-soft: #17283f; --dem-mid: #3d6aa8;
  --rep: #f08a80; --rep-soft: #3a1c1b; --rep-mid: #a8463f;
  --ind: #a99cf0; --ind-soft: #262140;
  --toss: #dcb85a; --toss-soft: #322a14; --toss-mid: #8d7330;
  --warn: #f0b45a; --warn-soft: #33260f;
  --c2026: #9D6FE6; --c2022: #BE8126; --focus: #b08ef0; color-scheme: dark }

html { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px) }
body { margin: 0 }
img { max-width: 100% }
[hidden] { display: none !important }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface) }
a { color: var(--accent); text-underline-offset: 2px }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.num, .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.15 }
h2 { font-size: 1.45rem; font-weight: 700 }
h3 { font-size: 1.12rem; font-weight: 600 }
.eyebrow { font-family: var(--f-display); font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600 }
.muted { color: var(--ink-3) } .small { font-size: .82rem } .tiny { font-size: .74rem }

/* header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--surface); border-bottom: 1px solid var(--line) }
.top .wrap { display: flex; align-items: center; gap: 12px 20px; flex-wrap: wrap; padding-block: 10px }
.brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0 }
.brand h1 { font-size: 1.35rem; font-weight: 700 }
.brand .count { font-family: var(--f-mono); font-size: .8rem; color: var(--ink-2) }
nav.tabs { display: flex; gap: 4px; margin-left: auto; background: var(--sunk); padding: 3px; border-radius: 999px }
nav.tabs a { font-family: var(--f-display); font-weight: 600; font-size: .95rem; text-decoration: none; color: var(--ink-2); padding: 6px 14px; border-radius: 999px; min-height: 36px; display: inline-flex; align-items: center }
nav.tabs a[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12) }
@media (max-width: 560px) { nav.tabs { margin-left: 0; width: 100% } nav.tabs a { flex: 1; justify-content: center; padding: 6px 8px } }

main { padding-block: 20px 60px; display: grid; gap: 22px }
main > *, section.panel > *, .card .body > *, .grid2 > *, .rules > *, .avg > *, .ctl > * { min-width: 0 }
section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 14px; min-width: 0 }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 16px; flex-wrap: wrap }
.stamp { font-size: .74rem; color: var(--ink-3); font-family: var(--f-mono) }
.note { font-size: .84rem; color: var(--ink-2); max-width: 72ch }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 14px }

/* chips & badges */
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap; font-family: var(--f-body) }
.chip.d { background: var(--dem-soft); color: var(--dem) } .chip.r { background: var(--rep-soft); color: var(--rep) }
.chip.t { background: var(--toss-soft); color: var(--toss) } .chip.i { background: var(--ind-soft); color: var(--ind) }
.chip.n { background: var(--sunk); color: var(--ink-2) }
.chip.moe { background: var(--warn-soft); color: var(--warn); border-color: currentColor }
.chip.gw { background: var(--accent-soft); color: var(--accent) }
.chip.flag { background: var(--ink); color: var(--surface) }
.chips { display: flex; flex-wrap: wrap; gap: 6px }

/* control math */
.ctl { display: grid; gap: 10px }
.ctl-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap }
.ctl-row .big { font-family: var(--f-display); font-size: 1.9rem; font-weight: 700; line-height: 1 }
.ctl-row .big .d { color: var(--dem) } .ctl-row .big .r { color: var(--rep) } .ctl-row .big .i { color: var(--ind) } .ctl-row .big .u { color: var(--ink-3) }
.bar { position: relative; height: 26px; display: flex; border-radius: 6px; overflow: hidden; background: var(--sunk); gap: 2px }
.bar span { display: block; height: 100% }
.bar .bd { background: var(--dem) } .bar .bdl { background: var(--dem-mid) } .bar .bu { background: var(--sunk) } .bar .bi { background: var(--ind) }
.bar .brl { background: var(--rep-mid) } .bar .br { background: var(--rep) }
.bar .bdx { background: var(--dem-soft); box-shadow: inset 0 0 0 1px var(--dem-mid) } .bar .brx { background: var(--rep-soft); box-shadow: inset 0 0 0 1px var(--rep-mid) }
.hrow { display: grid; gap: 4px }
.analysis { border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; display: grid; gap: 6px; font-size: .9rem }
.analysis p { margin: 0; max-width: 68ch } .analysis .lede { font-weight: 600 } .analysis .watch { color: var(--ink-2); font-size: .84rem }
.bar .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--ink) }
.bar-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: var(--ink-2) }
.sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px }
.status { font-family: var(--f-display); font-weight: 600; font-size: 1.02rem }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px }
.fact { background: var(--sunk); border-radius: 8px; padding: 8px 10px; min-width: 0 }
.fact b { display: block; font-family: var(--f-mono); font-size: .98rem; line-height: 1.3 }

/* ladder */
.ladder { display: grid; gap: 4px; overflow-x: auto }
.rung { display: grid; grid-template-columns: 28px minmax(0, 1fr) 90px 92px; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; background: var(--sunk); font-size: .86rem }
.rung.ga { outline: 2px solid var(--accent); outline-offset: -2px }
.rung.decided { opacity: .55 }
.rung .tp { font-size: .7rem; font-weight: 700 }
.rung .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.line-mark { font-size: .74rem; font-weight: 700; letter-spacing: .04em; padding: 2px 8px; border-left: 3px solid; margin: 2px 0 }
.line-mark.d { color: var(--dem); border-color: var(--dem) } .line-mark.r { color: var(--rep); border-color: var(--rep) }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface) }
.seg button { font: 600 .84rem var(--f-body); border: 0; background: transparent; color: var(--ink-2); padding: 7px 12px; min-height: 36px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface) }
select, input[type="search"] { font: .86rem var(--f-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-height: 36px }
.btn { font: 600 .84rem var(--f-body); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 7px 12px; min-height: 36px; cursor: pointer }

/* race card */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 14px; align-items: start }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; min-width: 0; overflow: hidden }
.card .stripe { height: 5px }
.card .body { padding: 14px; display: grid; gap: 12px; min-width: 0 }
.card-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start }
.card-head .t { min-width: 0 }
.card-head h3 { font-size: 1.2rem }
.cands { display: grid; gap: 3px; font-size: .9rem }
.cand { display: flex; gap: 6px; align-items: baseline; flex-wrap: wrap }
.pdot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; transform: translateY(-1px) }
.pdot.D { background: var(--dem) } .pdot.R { background: var(--rep) } .pdot.I { background: var(--ind) } .pdot.L, .pdot.Other { background: var(--ink-3) }
.rates { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px }
.rate { border-radius: 7px; padding: 6px 8px; font-size: .8rem; min-width: 0 }
.rate .who { font-size: .68rem; text-transform: uppercase; letter-spacing: .06em; opacity: .85; font-weight: 600 }
.rate .what { font-weight: 600; font-size: .86rem; line-height: 1.2 }
.rate.d { background: var(--dem-soft); color: var(--dem) } .rate.r { background: var(--rep-soft); color: var(--rep) }
.rate.t { background: var(--toss-soft); color: var(--toss) } .rate.n { background: var(--sunk); color: var(--ink-3) } .rate.i { background: var(--ind-soft); color: var(--ind) }
.avg { display: grid; gap: 6px }
.avg-top { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap }
.avg-top .m { font-family: var(--f-display); font-size: 1.5rem; font-weight: 700 }
.m.d { color: var(--dem) } .m.r { color: var(--rep) } .m.i { color: var(--ind) } .m.t { color: var(--toss) }
.meter { position: relative; height: 8px; background: var(--sunk); border-radius: 4px }
.meter .zero { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: var(--ink-3) }
.meter .fill { position: absolute; top: 0; bottom: 0; border-radius: 4px }
.meter .moe { position: absolute; top: -2px; bottom: -2px; border: 1.5px dashed var(--warn); border-radius: 4px }
table { border-collapse: collapse; width: 100%; font-size: .82rem }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top }
th { font-weight: 600; color: var(--ink-3); font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap }
td.r, th.r { text-align: right }
.tscroll { overflow-x: auto; min-width: 0 }
details summary { cursor: pointer; font-weight: 600; font-size: .86rem; color: var(--ink-2); list-style-position: outside }
details[open] summary { margin-bottom: 6px }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px }
.pick { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden }
.pick button { font: 700 .82rem var(--f-mono); border: 0; background: var(--surface); color: var(--ink-2); min-width: 44px; min-height: 36px; cursor: pointer }
.pick button + button { border-left: 1px solid var(--line) }
.pick button[aria-pressed="true"].D { background: var(--dem); color: #fff }
.pick button[aria-pressed="true"].R { background: var(--rep); color: #fff }
.pick button[aria-pressed="true"].I { background: var(--ind); color: #fff }
.pick button[aria-pressed="true"].U { background: var(--ink-3); color: var(--surface) }
.nodata { color: var(--ink-3); font-style: italic }

/* georgia */
.rules { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px }
.rule { background: var(--sunk); border-radius: 8px; padding: 12px; display: grid; gap: 6px; align-content: start }
.rule .k { font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; line-height: 1.05 }
tr.focus td { background: var(--accent-soft) }
tr.gw td:first-child { box-shadow: inset 3px 0 0 var(--accent) }
.chart { width: 100%; height: auto; display: block; overflow: visible }
.chart text { fill: var(--ink-3); font: 11px var(--f-mono) }
.chart .grid line { stroke: var(--line) }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--surface); font: .78rem var(--f-mono); padding: 6px 8px; border-radius: 6px; white-space: nowrap; transform: translate(-50%, -110%) }
.chartbox { position: relative }
.src-list { display: grid; gap: 8px }
.src { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; padding: 10px 12px; background: var(--sunk); border-radius: 8px; font-size: .86rem }
.ok { color: var(--dem) } .blocked { color: var(--rep) }
code { font-family: var(--f-mono); font-size: .85em; background: var(--sunk); padding: 1px 5px; border-radius: 4px }
.loading { padding: 40px 0; color: var(--ink-3) }
.hdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; background: var(--ink-3) }
.hdot.green { background: #2e9d5b } .hdot.yellow { background: #d9a227 } .hdot.red { background: var(--rep) }
.srcstrip { display: flex; flex-wrap: wrap; gap: 6px }
.src-chip { display: inline-flex; align-items: center; gap: 2px; background: var(--sunk); border-radius: 999px; padding: 3px 10px; font-size: .8rem; font-weight: 600 }
.slots { display: grid; gap: 8px } .slot { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; align-items: center }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; text-align: left }
.ga-callout { border-left: 4px solid var(--accent) }
details.pre > summary { font-family: var(--f-display); font-size: 1.15rem; font-weight: 600; color: var(--ink); padding: 8px 0 }
@media (prefers-reduced-motion: no-preference) { .bar span { transition: flex-basis .25s ease } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Battleground 2026</h1><span class="count" id="countdown"></span></div>
    <nav class="tabs" aria-label="Views">
      <a href="#georgia" data-view="georgia">Georgia</a>
      <a href="#results" data-view="results">Results</a>
      <a href="#national" data-view="national">National</a>
      <a href="#sources" data-view="sources">Sources</a>
    </nav>
  </div>
</header>

<main class="wrap" id="app"><p class="loading">Loading race data…</p></main>

<script>
(() => {
const TZ = 'America/New_York';
const ELECTION = new Date('2026-11-03T07:00:00-05:00');
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtN = n => n == null ? '—' : Number(n).toLocaleString('en-US');
const fmtTS = iso => { if (!iso) return 'no data'; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' ET'; };
const shortDate = s => s ? String(s).replace(/, 2026$/, '').replace('October', 'Oct').replace('September', 'Sep').replace('November', 'Nov').replace('August', 'Aug') : '—';
const link = (url, text) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(text)}</a>` : esc(text);

let R = null, G = null;
let picks = {};
try { picks = JSON.parse(localStorage.getItem('bg26-picks') || '{}') || {}; } catch (e) { picks = {}; }
const savePicks = () => { try { localStorage.setItem('bg26-picks', JSON.stringify(picks)); } catch (e) {} };
const ui = { chamber: 'all', sort: 'close', q: '' };

// rating -> signed score (+D / -R), used only for colour and ordering
function score(r) {
  if (!r) return null;
  r = String(r).replace(' (flip)', '');
  if (/^toss/i.test(r)) return 0;
  const m = r.match(/^(Tilt|Lean|Likely|Solid|Safe) ([DRI])/);
  if (!m) return null;
  const v = { Tilt: 1, Lean: 2, Likely: 3, Solid: 4, Safe: 4 }[m[1]];
  return m[2] === 'R' ? -v : v;
}
const rateCls = r => { const s = score(r); if (s == null) return 'n'; if (s === 0) return 't'; if (/ I/.test(r)) return 'i'; return s > 0 ? 'd' : 'r'; };
const sideCls = (m, demParty) => m == null ? 't' : Math.abs(m) < 0.05 ? 't' : m > 0 ? (demParty === 'I' ? 'i' : 'd') : 'r';
function stripeColor(r) {
  const s = r.mean_score;
  if (s == null) return 'var(--line)';
  if (Math.abs(s) < 0.5) return 'var(--toss-mid)';
  if (s > 0) return s >= 2.5 ? 'var(--dem)' : 'var(--dem-mid)';
  return s <= -2.5 ? 'var(--rep)' : 'var(--rep-mid)';
}
function marginLabel(m, main) {
  if (m == null) return null;
  if (Math.abs(m) < 0.05) return 'Tied';
  return `${m > 0 ? main.dem_side : main.rep_side} +${Math.abs(m).toFixed(1)}`;
}
function moeInfo(race) {
  const polls = race.polling?.polls || [];
  const moes = polls.map(p => p.moe).filter(x => x != null);
  if (race.consensus != null && moes.length) {
    const avg = moes.reduce((a, b) => a + b, 0) / moes.length;
    return { within: Math.abs(race.consensus) <= avg, moe: avg, basis: `average margin vs. the mean ±${avg.toFixed(1)} MoE of the ${moes.length} most recent polls` };
  }
  const p = polls[0];
  if (p && p.moe != null) return { within: Math.abs(p.margin) <= p.moe, moe: p.moe, basis: `latest poll's lead vs. its own ±${p.moe} MoE (no published average)` };
  return null;
}
const closeKey = r => r.consensus != null ? Math.abs(r.consensus) : (r.polling?.polls?.[0] ? 50 + Math.abs(r.polling.polls[0].margin) : 100 + Math.abs(r.mean_score ?? 9));

// ---------------------------------------------------------------- shared card pieces
function ratingsHTML(ratings) {
  const keys = [['cook', 'Cook'], ['ie', 'Inside Elections'], ['sabato', 'Sabato']];
  return `<div class="rates">${keys.map(([k, n]) => {
    const x = ratings?.[k];
    if (!x || !x.rating) return `<div class="rate n"><div class="who">${n}</div><div class="what nodata">no data</div></div>`;
    return `<div class="rate ${rateCls(x.rating)}" title="${esc(n)} as of ${esc(x.as_of)}"><div class="who">${n}</div><div class="what">${esc(x.rating)}</div><div class="tiny">${esc(shortDate(x.as_of))}</div></div>`;
  }).join('')}</div>`;
}
function meterHTML(m, moe, demParty) {
  if (m == null) return '';
  const cap = 15, w = Math.min(Math.abs(m), cap) / cap * 50;
  const color = Math.abs(m) < 0.05 ? 'var(--toss)' : m > 0 ? (demParty === 'I' ? 'var(--ind)' : 'var(--dem)') : 'var(--rep)';

// ---------------------------------------------------------------- control math
function tally(chamber) {
  const C = R.control[chamber];
  const list = R.races.filter(r => r.chamber === chamber);
  const t = { D: C.base.D, R: C.base.R, I: 0, U: 0, leanD: 0, leanR: 0, toss: 0 };
  for (const r of list) {
    const p = picks[r.id];
    if (p === 'D') t.D++; else if (p === 'R') t.R++; else if (p === 'I') t.I++;
    else {
      t.U++;
      const s = score(r.ratings?.cook?.rating);
      if (s > 0) t.leanD++; else if (s < 0) t.leanR++; else t.toss++;
    }
  }
  return { t, C, list };
}
function controlPanel(chamber) {

function pathPanel() {
  const { t } = tally('senate');

  const dPool = und.filter(r => r.main?.dem_party !== 'I');
  const ord = [...und].sort((a, b) => (b.consensus ?? -99) - (a.consensus ?? -99)); // D-best first
  const dOrd = ord.filter(r => r.main?.dem_party !== 'I');
  const dTip = needD > 0 && needD <= dOrd.length ? dOrd[needD - 1] : null;
  const rOrd = [...ord].reverse();
  const rTip = needR > 0 && needR <= rOrd.length ? rOrd[needR - 1] : null;
  const ga = sen.find(r => r.id === 'S-GA');
  const dMsg = t.D >= 51 ? 'Democrats already have 51 in this scenario.' : needD > dPool.length ? `Democrats can no longer reach 51 (need ${needD}, only ${dPool.length} undecided races they can win).` : needD === dPool.length ? `Democrats must win <b>every one</b> of the ${dPool.length} remaining races they contest.` : `Democrats need <b>any ${needD}</b> of the ${dPool.length} undecided races (Nebraska's Osborn is an independent and is not counted toward 51).`;
  const rMsg = t.R >= 50 ? 'Republicans already have 50 + the VP tiebreak in this scenario.' : needR > und.length ? `Republicans can no longer reach 50.` : needR === und.length ? `Republicans must win <b>every one</b> of the ${und.length} remaining races.` : `Republicans need <b>any ${needR}</b> of the ${und.length} undecided races (50 seats + VP tiebreak).`;
  let dCount = t.D, rCount = t.R;
  const rows = ord.map((r, i) => {
    const isGA = r.id === 'S-GA';
    const m = r.consensus;
    let pre = '';
    const row = `<div class="rung${isGA ? ' ga' : ''}"><span class="tp num">${i + 1}</span><span class="who"><b>${esc(r.state)}</b> <span class="muted small">${esc(r.main.dem_side)} v ${esc(r.main.rep_side)}</span>${isGA ? ' <span class="chip gw">GA</span>' : ''}</span><span class="m ${sideCls(m, r.main.dem_party)} num small">${esc(marginLabel(m, r.main) ?? 'no avg')}</span><span class="small muted">${esc(r.ratings?.cook?.rating ?? '')}</span></div>`;
    let after = '';
    if (dTip === r) after += `<div class="line-mark d">▲ Democrats reach 51 if they win every race down to here (tipping point: ${esc(r.state)})</div>`;
    if (rTip === r) pre += `<div class="line-mark r">▼ Republicans reach 50 if they win every race from the bottom up to here (tipping point: ${esc(r.state)})</div>`;
    return pre + row + after;
  }).join('');
  const gaLine = ga ? (() => {
    const pos = ord.indexOf(ga);
    return picks['S-GA'] ? `You have assigned Georgia to <b>${picks['S-GA']}</b>.` :
      `Georgia (Ossoff v. Collins, ${esc(marginLabel(ga.consensus, ga.main))} in the average) ranks <b>#${pos + 1}</b> of ${ord.length} for Democrats. ${dTip && pos >= 0 && pos < dOrd.indexOf(dTip) + 1 ? 'It sits inside the Democrats\' path: losing it means winning a race further down the list.' : ''} For Republicans, flipping Georgia would replace the need to win one of the closer races. It is rated Likely D by all three raters and is included here by hand. If no candidate reaches 50%, it goes to a runoff on December 1, so control might not be known on election night.`;
  })() : '';
  return `<section class="panel" id="path"><div class="panel-head"><h2>Path to a Senate majority</h2><span class="stamp">Ordered by polling average, from best for Democrats to best for Republicans</span></div>
    <div class="grid2"><p class="note" style="margin:0"><b style="color:var(--dem)">Democrats:</b> ${dMsg}</p><p class="note" style="margin:0"><b style="color:var(--rep)">Republicans:</b> ${rMsg}</p></div>
    <p class="note" style="margin:0">${gaLine}</p>

}

function gaCard(s) {

  const avgs = s.polling?.averages || [];
  const dAvg = avgs.length ? avgs.reduce((a, x) => a + (x.dem || 0), 0) / avgs.length : null;
  const rAvg = avgs.length ? avgs.reduce((a, x) => a + (x.rep || 0), 0) / avgs.length : null;
  const runoffRisk = dAvg != null && dAvg < 50 && rAvg < 50;

  const race = { ...s, chamber: 'ga', mean_score: (() => { const v = Object.values(s.ratings || {}).map(x => score(x.rating)).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; })() };

function turnoutChart(daily) {
  const W = 640, H = 240, L = 54, Rr = 72, T = 14, B = 30;
  const pts = daily;
  const maxY = Math.max(...pts.map(d => Math.max(d.y2026 || 0, d.y2022 || 0)));
  const yTop = Math.ceil(maxY / 500000) * 500000;
  const x = i => L + i / (pts.length - 1) * (W - L - Rr);
  const y = v => T + (1 - v / yTop) * (H - T - B);
  const path = key => pts.map((d, i) => d[key] == null ? null : `${x(i).toFixed(1)},${y(d[key]).toFixed(1)}`).filter(Boolean).map((p, i) => (i ? 'L' : 'M') + p).join('');
  const ticks = []; for (let v = 0; v <= yTop; v += 500000) ticks.push(v);
  const xt = pts.map((d, i) => ({ d, i })).filter(({ d }) => /-(05|12|19|26|03)$/.test(d.date) || d.date === '2026-11-03');
  const last26 = pts.reduce((a, d, i) => d.y2026 != null ? i : a, 0);
  const lastI = pts.length - 1;
  return `<div class="chartbox" id="tchart"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative early and mail votes, 2026 compared with 2022 at the same point">
    <g class="grid">${ticks.map(v => `<line x1="${L}" x2="${W - Rr}" y1="${y(v)}" y2="${y(v)}"></line><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v ? (v / 1e6).toFixed(1) + 'M' : '0'}</text>`).join('')}</g>
    ${xt.map(({ d, i }) => `<text x="${x(i)}" y="${H - 8}" text-anchor="middle">${d.date.slice(5).replace('-', '/')}</text>`).join('')}
    <path d="${path('y2022')}" fill="none" stroke="var(--c2022)" stroke-width="2" stroke-dasharray="5 4"></path>
    <path d="${path('y2026')}" fill="none" stroke="var(--c2026)" stroke-width="2.5"></path>
    <circle cx="${x(last26)}" cy="${y(pts[last26].y2026)}" r="4.5" fill="var(--c2026)" stroke="var(--surface)" stroke-width="2"></circle>
    <text x="${x(last26) + 8}" y="${y(pts[last26].y2026) - 6}" style="fill:var(--ink);font-weight:500">2026</text>
    <text x="${x(lastI) + 6}" y="${y(pts[lastI].y2022) + 14}" style="fill:var(--ink-2)">2022</text>
    <line id="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--ink-3)" stroke-width="1" visibility="hidden"></line>
    <rect x="${L}" y="${T}" width="${W - L - Rr}" height="${H - T - B}" fill="transparent" id="hit"></rect>
  </svg><div class="tip" id="tip" hidden></div></div>`;
}
function bindChart(daily) {
  const box = $('#tchart'); if (!box) return;
  const svg = $('svg', box), hit = $('#hit', box), tip = $('#tip', box), xh = $('#xh', box);
  const W = 640, L = 54, Rr = 72;
  const show = ev => {
    const r = svg.getBoundingClientRect();
    const sx = (ev.clientX - r.left) / r.width * W;
    const i = Math.max(0, Math.min(daily.length - 1, Math.round((sx - L) / (W - L - Rr) * (daily.length - 1))));
    const d = daily[i], px = L + i / (daily.length - 1) * (W - L - Rr);
    xh.setAttribute('x1', px); xh.setAttribute('x2', px); xh.setAttribute('visibility', 'visible');
    tip.hidden = false; tip.style.left = (px / W * r.width) + 'px'; tip.style.top = '18px';
    tip.textContent = `${d.date}  2026: ${d.y2026 == null ? '—' : fmtN(d.y2026)}  2022: ${fmtN(d.y2022)}`;
  };
  hit.addEventListener('pointermove', show); hit.addEventListener('pointerdown', show);
  hit.addEventListener('pointerleave', () => { tip.hidden = true; xh.setAttribute('visibility', 'hidden'); });
}

  return hrs >= c.last ? 'closed' : hrs >= c.first ? 'partly' : 'open';
}
const clockTxt = h => { const hh = Math.floor(h) % 24, mm = Math.round((h % 1) * 60); return `${(hh % 12) || 12}:${String(mm).padStart(2, '0')} ${hh >= 12 ? 'PM' : 'AM'}${h >= 24 ? ' (Nov 4)' : ''}`; };

function sourcesStrip() {
  const off = L.sources.filter(s => s.kind === 'official'), none = L.sources.filter(s => s.kind === 'none');
  return `<div class="srcstrip">${off.map(s => `<span class="src-chip" title="${esc(s.name)}: ${esc(s.status)}${s.last_error ? ' · ' + esc(s.last_error) : ''}">${healthDot(s.health)}${esc(s.state)} <span class="muted tiny">${esc(s.status === 'not_live' ? 'not live yet' : agoTxt(s.last_ok))}</span></span>`).join('')}</div>
    <details><summary>${none.length} tracked states have no automated official source</summary><ul class="small" style="margin:6px 0 0;padding-left:18px">${none.map(s => `<li>${healthDot('red')}<b>${esc(s.state)}</b>: ${esc(s.reason)}</li>`).join('')}</ul></details>`;
}
function closingsPanel() {
  const races = Object.values(L.races);
  const slots = {};
  for (const r of races) { if (!r.closes?.last) continue; (slots[r.closes.last] ||= new Set()).add(r.state); }
  return `<section class="panel"><div class="panel-head"><h2>Poll closings (Eastern)</h2><span class="stamp">${link(races[0]?.closes?.source, '270toWin schedule')}</span></div>
    <div class="slots">${Object.keys(slots).map(Number).sort((a, b) => a - b).map(h => `<div class="slot"><b class="num">${clockTxt(h)}</b><div class="chips">${[...slots[h]].sort().map(st => { const r = races.find(x => x.state === st); const cs = closedState(r.closes); return `<span class="chip ${cs === 'closed' ? 'flag' : cs === 'partly' ? 't' : 'n'}" title="${cs === 'closed' ? 'All polls closed' : cs === 'partly' ? 'Some polls closed' : 'Polls open'}">${esc(st)}${cs === 'partly' ? ' ◐' : ''}</span>`; }).join('')}</div></div>`).join('')}</div>
    <p class="tiny muted">Dark = all polls closed. ◐ = state spans two time zones and part has closed. Times are the latest closing in each state.</p></section>`;
}
function liveRaceCard(e) {
  const r = e.result, dp = e.chamber === 'senate' && e.state === 'NE' ? 'I' : 'D';
  const cands = r ? [...r.candidates].filter(c => !c.write_in).sort((a, b) => b.votes - a.votes).slice(0, 4) : [];
  const fl = e.flags || {};
  const chips = [
    e.call ? `<span class="chip flag">Called: ${esc(e.call.winner)} · ${esc(e.call.outlet)} ${esc(fmtTS(e.call.called_at))}</span>` : '<span class="chip n">Not called</span>',
    fl.recount?.within ? `<span class="chip moe">Recount margin: ${esc(fl.recount.rule.type)} (${esc(fl.recount.diff_pct)}%)</span>` : '',
    fl.majority && fl.majority.above === false ? `<span class="chip moe">${fl.majority.type === 'runoff' ? (fl.majority.likely ? 'Likely runoff' : 'Below 50%') : fl.majority.type === 'rcv' ? 'Below 50%: ranked-choice count' : 'Below 50%: legislature decides'}</span>` : '',
    e.discrepancy ? '<span class="chip moe">Source disagreement</span>' : '',
    staleBadge(e.stale, e.source?.last_checked)].join('');
  return `<article class="card"><div class="stripe" style="background:${e.margin_dr == null ? 'var(--line)' : e.margin_dr > 0 ? 'var(--dem)' : 'var(--rep)'}"></div><div class="body">
    <div class="card-head"><div class="t"><div class="eyebrow">${e.chamber === 'senate' ? 'Senate' : 'Governor'} · polls close ${e.closes?.last != null ? clockTxt(e.closes.last) : '—'}</div><h3>${esc(R.races.find(x => x.id === e.id)?.state || e.label)}</h3></div><div class="chips" style="justify-content:flex-end">${chips}</div></div>
    ${r ? `<div class="tscroll"><table><thead><tr><th>Candidate</th><th class="r">Votes</th><th class="r">%</th></tr></thead><tbody>${cands.map(c => `<tr><td><span class="pdot ${esc(c.party)}"></span> ${esc(c.name)}</td><td class="r num">${fmtN(c.votes)}</td><td class="r num">${pctTxt(c.pct)}</td></tr>`).join('')}</tbody></table></div>
      <div class="facts"><div class="fact"><span class="eyebrow">Counted</span><b>${repTxt(e.reporting)}</b><span class="tiny">Expected vote: no data (no official estimate)</span></div>
        <div class="fact"><span class="eyebrow">Margin now</span><b>${marginTxt(e.margin_dr, dp)}</b><span class="tiny">Final poll avg ${marginTxt(e.poll_avg_dr, dp)} · 2024 pres ${e.pres2024_margin_r == null ? '—' : marginTxt(-e.pres2024_margin_r)}</span></div></div>
      ${e.discrepancy ? `<p class="small" style="color:var(--warn)">Official vs ${esc(e.discrepancy[0].secondary_source)}: ${e.discrepancy.map(d => `${esc(d.candidate)} ${fmtN(d.official)} vs ${fmtN(d.secondary)}`).join('; ')}. Showing the official number.</p>` : ''}
      ${fl.majority ? `<p class="tiny muted">${esc(fl.majority.rule.text)}</p>` : ''}
      ${fl.recount?.within ? `<p class="tiny muted">${esc(fl.recount.rule.text)} ${link(fl.recount.rule.url, 'Rule')}</p>` : ''}`
      : `<p class="nodata small">Results: no data. ${esc(e.notes.join(' '))}</p>`}
    ${e.notes.length && r ? `<p class="tiny muted">${esc(e.notes.join(' '))}</p>` : ''}
    <div class="stamp">${e.source ? `${link(e.source.url, e.source.name)} · data as of ${esc(e.source.as_of || fmtTS(e.source.fetched_at))} · checked ${esc(agoTxt(e.source.last_checked || e.source.fetched_at))}` : 'No source'}</div>
  </div></article>`;
}
function seatTracker() {
  const C = R.control.senate;
  const sen = Object.values(L.races).filter(e => e.chamber === 'senate');
  const t = { cD: 0, cR: 0, cI: 0, lD: 0, lR: 0, lI: 0, none: 0 };
  for (const e of sen) {
    if (e.call) { t['c' + (e.call.party === 'D' ? 'D' : e.call.party === 'I' ? 'I' : 'R')]++; continue; }
    if (e.leader_party && e.total_votes > 0) t['l' + (e.leader_party === 'D' ? 'D' : e.leader_party === 'I' ? 'I' : 'R')]++; else t.none++;
  }
  const D = C.base.D + t.cD, Rr = C.base.R + t.cR;
  const ga = L.races['S-GA'];
  const gaM = ga?.flags?.majority;
  const gaTxt = !ga?.result ? '<span class="nodata">no results yet</span>' : `${esc(ga.leader || '—')} leads, ${marginTxt(ga.margin_dr)} · ${repTxt(ga.reporting)}${gaM ? ` · leader at ${pctTxt(gaM.leader_pct)} ${gaM.above ? '(above 50%)' : '(below 50%: runoff Dec 1 if it stays there)'}` : ''}`;
  return `<section class="panel"><div class="panel-head"><h2>Senate seat tracker</h2><span class="stamp">Republicans need 50 (VP Vance breaks ties); Democrats need 51</span></div>
    <div class="facts">
      <div class="fact"><span class="eyebrow">Democrats</span><b style="color:var(--dem)">${D} certain + ${t.lD} leading</b><span class="tiny">${C.base.D} not in play · ${t.cD} called</span></div>
      <div class="fact"><span class="eyebrow">Republicans</span><b style="color:var(--rep)">${Rr} certain + ${t.lR} leading</b><span class="tiny">${C.base.R} not in play · ${t.cR} called</span></div>
      <div class="fact"><span class="eyebrow">Independent (NE)</span><b style="color:var(--ind)">${t.cI} called + ${t.lI} leading</b><span class="tiny">Not counted toward either majority</span></div>
      <div class="fact"><span class="eyebrow">No results yet</span><b>${t.none}</b><span class="tiny">of ${sen.length} tracked races</span></div>
    </div>
    <div class="rule ga-callout"><span class="eyebrow">Georgia Senate · Ossoff v. Collins</span><b>${gaTxt}</b>${staleBadge(ga?.stale, ga?.source?.last_checked)}</div>
    <p class="tiny muted">"Certain" counts seats not on the ballot or rated Solid/Likely (from the pre-election view) plus races called by a named outlet. "Leading" is the current vote count only and changes as votes come in. ${esc(L.calls_note)}</p></section>`;
}
function uncalledPanel() {
  const list = Object.values(L.races).filter(e => !e.call).sort((a, b) => (a.margin_dr == null) - (b.margin_dr == null) || Math.abs(a.margin_dr ?? 0) - Math.abs(b.margin_dr ?? 0));
  return `<section class="panel"><div class="panel-head"><h2>Still uncalled</h2><span class="stamp">Closest first</span></div>
    <div class="tscroll"><table><thead><tr><th>Race</th><th class="r">Margin</th><th>Counted</th><th>Notes</th></tr></thead><tbody>
    ${list.map(e => `<tr><td><b>${esc(e.state)}</b> ${e.chamber === 'senate' ? 'Sen' : 'Gov'}</td><td class="r num">${marginTxt(e.margin_dr, e.state === 'NE' && e.chamber === 'senate' ? 'I' : 'D')}</td><td class="small">${e.result ? repTxt(e.reporting) : '<span class="nodata">no data</span>'}</td><td class="tiny">${esc([...(e.notes || [])].join(' ')) || (e.flags?.recount?.within ? 'Within recount margin' : '')}</td></tr>`).join('')}
    </tbody></table></div></section>`;
}
function resultsView() {
  if (!L) return `<section class="panel"><h2>Live results</h2><p class="note">${esc(liveErr || 'The live results file is not available yet. It appears once the election-night poller has run.')}</p></section>`;
  const cards = Object.values(L.races).sort((a, b) => (a.chamber === 'senate' ? 0 : 1) - (b.chamber === 'senate' ? 0 : 1) || (a.closes?.last ?? 99) - (b.closes?.last ?? 99));
  return `<section class="panel"><div class="panel-head"><h2>Live results</h2><span class="stamp">Updated ${esc(agoTxt(L.generated_at))} · refreshes every minute</span></div>
    ${minsAgo(L.generated_at) > L.stale_after_min ? `<p class="chip moe">The whole results file is ${Math.round(minsAgo(L.generated_at))} minutes old. The poller may be between runs.</p>` : ''}
    ${sourcesStrip()}<p class="tiny muted">${esc(L.expected_vote_note)}</p></section>
  ${seatTracker()}${closingsPanel()}${uncalledPanel()}
  <section class="panel"><div class="panel-head"><h2>Tracked races</h2></div><div class="cards">${cards.map(liveRaceCard).join('')}</div></section>`;
}

// Georgia live
function gaLive() {
  if (!L) return '';
  const G2 = L.ga, src = L.sources.find(s => s.id === 'ga');
  if (!G2.contests.length) return `<section class="panel"><div class="panel-head"><h2>Georgia results</h2><span class="stamp">${healthDot(src?.health)} ${esc(src?.status === 'not_live' ? 'Georgia has not posted the Nov 3 results page yet; checking every 2 minutes' : src?.status || '')}</span></div><p class="note">Results appear here after polls close at 7:00 PM. Last check ${esc(agoTxt(src?.last_ok))}.</p></section>`;
  const order = k => k === 'GA-SEN' ? 0 : k === 'GA-GOV' ? 1 : /^GA-\d\d$/.test(k) ? 3 : /AMEND|REF/.test(k) ? 4 : 2;
  const cs = [...G2.contests].sort((a, b) => order(a.key) - order(b.key) || a.key.localeCompare(b.key));
  const cand = cs.filter(c => c.flags?.majority);
  const rc = cs.filter(c => c.flags?.recount?.within);
  const sel = cs.find(c => c.key === gaPick) || cs[0];
  return `<section class="panel"><div class="panel-head"><h2>Georgia results</h2><span class="stamp">${healthDot(src?.health)} ${link(src?.url, 'GA Secretary of State')} · checked ${esc(agoTxt(src?.last_ok))}${src?.last_change ? ` · last new data ${esc(agoTxt(src.last_change))}` : ''}</span></div>
    ${staleBadge(cs[0]?.stale, src?.last_ok)}
    <div class="grid2">
      <div class="rule"><span class="eyebrow">Runoff watch · 50% + 1 to win · runoff ${esc(G.rules.runoff.date_label)}</span>
        <div class="tscroll"><table><tbody>${cand.map(c => { const m = c.flags.majority; return `<tr><td>${esc(c.office)}</td><td class="r num">${pctTxt(m.leader_pct)}</td><td>${m.leader_pct == null ? '' : m.above ? '<span class="chip d">Above 50%</span>' : m.likely ? '<span class="chip moe">Likely runoff</span>' : '<span class="chip t">Below 50%</span>'}</td></tr>`; }).join('')}</tbody></table></div>
        <span class="tiny muted">"Likely runoff" = leader below 50% with at least 95% of precincts in. It is a rule check on official counts, not a projection.</span></div>
      <div class="rule"><span class="eyebrow">Recount watch · margin ≤ 0.5% (candidate may request)</span>
        ${rc.length ? `<ul class="small" style="margin:0;padding-left:18px">${rc.map(c => `<li><b>${esc(c.office)}</b>: ${fmtN(c.flags.recount.diff_votes)} votes (${c.flags.recount.diff_pct}%)</li>`).join('')}</ul>` : '<p class="small" style="margin:0">No Georgia race is within 0.5% right now.</p>'}
        <span class="tiny muted">${link(G.rules.recount.sources[0].url, 'O.C.G.A. § 21-2-495')}</span></div>
    </div>
    <div class="tscroll"><table><thead><tr><th>Contest</th><th>Leader</th><th class="r">Margin</th><th>Counted</th></tr></thead><tbody>
      ${cs.map(c => `<tr class="${c.key === sel.key ? 'focus' : ''}"><td><button class="linkbtn" data-ga="${esc(c.key)}">${esc(c.office)}</button></td><td>${esc(c.leader || '—')}</td><td class="r num">${c.contest_type === 'Candidate' && /AMEND|REF/.test(c.key) ? (() => { const y = c.candidates.find(x => /^yes/i.test(x.name)); return y ? `Yes ${pctTxt(y.pct)}` : '—'; })() : marginTxt(c.margin_dr)}</td><td class="small">${repTxt(c.reporting_precincts || c.reporting)}</td></tr>`).join('')}
    </tbody></table></div>
    ${gaContestDetail(sel)}
  </section>`;
}
function gaContestDetail(c) {
  if (!c) return '';
  const bym = c.candidates.filter(x => !x.write_in);
  const methods = [['election_day', 'Election Day'], ['advance', 'Early in person'], ['absentee_mail', 'Absentee by mail'], ['provisional', 'Provisional']];
  const st24 = GAP?.statewide_margin_r;
  const counties = (c.counties || []).map(co => {
    const d = co.candidates.find(x => x.party === 'D'), r = co.candidates.find(x => x.party === 'R');
    const m = d && r && co.total_votes ? d.pct - r.pct : null;
    const p24 = GAP?.counties?.[co.county]?.margin_r;
    return { ...co, m, p24, shift: m != null && p24 != null ? m + p24 : null, share: co.reporting?.total ? co.reporting.units / co.reporting.total : null };
  });
  const bell = GAP?.closest_to_statewide?.slice(0, 4) || [];
  const pinned = [...PINNED, ...bell].map(n => counties.find(x => x.county === n)).filter(Boolean);
  const rest = counties.filter(x => !PINNED.includes(x.county) && !bell.includes(x.county)).sort((a, b) => b.total_votes - a.total_votes);
  const row = co => `<tr class="${PINNED.includes(co.county) ? 'focus' : bell.includes(co.county) ? 'gw' : ''}"><td><b>${esc(co.county)}</b>${co.county === 'Gwinnett' ? ' <span class="chip gw">You</span>' : bell.includes(co.county) ? ' <span class="tiny muted">bellwether</span>' : ''}</td><td class="r num">${co.share == null ? '—' : (100 * co.share).toFixed(0) + '%'}</td><td class="r num">${fmtN(co.total_votes)}</td><td class="r num">${marginTxt(co.m)}</td><td class="r num">${co.p24 == null ? '—' : marginTxt(-co.p24)}</td><td class="r num" style="color:${co.shift == null ? 'inherit' : co.shift > 0 ? 'var(--dem)' : 'var(--rep)'}">${co.shift == null || !co.total_votes ? '—' : `${co.shift > 0 ? 'D' : 'R'} ${Math.abs(co.shift).toFixed(1)}`}</td></tr>`;
  return `<div class="rule"><span class="eyebrow">${esc(c.office)}: vote by method (statewide)</span>
    <div class="tscroll"><table><thead><tr><th>Candidate</th>${methods.map(([, n]) => `<th class="r">${n}</th>`).join('')}<th class="r">Total</th></tr></thead><tbody>
    ${bym.map(x => `<tr><td>${esc(x.name)}</td>${methods.map(([k]) => `<td class="r num">${x.by_method?.[k] == null ? '—' : fmtN(x.by_method[k])}</td>`).join('')}<td class="r num">${fmtN(x.votes)}</td></tr>`).join('')}</tbody></table></div></div>
  ${counties.length ? `<details open><summary>All 159 counties: ${esc(c.office)}</summary>
    <p class="tiny muted">Pinned: Gwinnett, Fulton, Cobb, DeKalb, then the four counties whose 2024 presidential margin was closest to the statewide R+${st24} (${esc(bell.join(', '))}). "vs 2024" compares the current Democratic-minus-Republican margin with the 2024 presidential margin in that county; it says which side is running ahead of 2024, and is only meaningful once most of a county is counted.</p>
    <div class="tscroll"><table><thead><tr><th>County</th><th class="r">Precincts in</th><th class="r">Votes</th><th class="r">Margin</th><th class="r">2024 pres</th><th class="r">vs 2024</th></tr></thead><tbody>${pinned.map(row).join('')}${rest.map(row).join('')}</tbody></table></div>
    <p class="tiny muted">2024 margins: certified results from the ${link(GAP?.source, 'GA Secretary of State')}.</p></details>` : '<p class="small nodata">County results: no data for this contest yet.</p>'}`;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-ga]'); if (b) { gaPick = b.dataset.ga; rerenderKeep(); } });
async function loadLive() {
  try {
    const r = await fetch('live/live.json?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    L = await r.json(); liveErr = null;
  } catch (err) { liveErr = 'Live results file not reachable (' + err.message + ').'; }
}

function georgiaView() {
  if (!L) return georgiaPre();
  return gaLive() + `<details class="pre"><summary>Pre-election: rules, early vote, polls and districts</summary><div style="display:grid;gap:22px">${georgiaPre()}</div></details>`;
}

// ---------------------------------------------------------------- routing & events
function view() { const h = location.hash.replace('#', ''); return ['georgia', 'results', 'national', 'sources'].includes(h) ? h : 'georgia'; }
function render() {
  const v = view();
  document.querySelectorAll('nav.tabs a').forEach(a => a.setAttribute('aria-current', a.dataset.view === v ? 'page' : 'false'));
  const y = window.scrollY;
  $('#app').innerHTML = v === 'georgia' ? georgiaView() : v === 'results' ? resultsView() : v === 'national' ? nationalView() : sourcesView();
  if (v === 'georgia') bindChart(G.turnout.daily);
  return y;
}
function rerenderKeep(focusSel) {
  const y = window.scrollY; render(); window.scrollTo(0, y);
  if (focusSel) { const el = $(focusSel); if (el) { el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); } }
}
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.pick) {
    const id = b.dataset.pick, v = b.dataset.v;
    if (v === 'U') delete picks[id]; else picks[id] = v;
    savePicks(); rerenderKeep(`[data-pick="${CSS.escape(id)}"][data-v="${v}"]`);
  } else if (b.dataset.f) { ui.chamber = b.dataset.f; rerenderKeep(); }
  else if (b.id === 'reset') { picks = {}; savePicks(); rerenderKeep(); }
  else if (b.id === 'leaders') {
    for (const r of R.races.filter(x => x.chamber === 'senate')) {
      const m = r.consensus;
      if (m == null || Math.abs(m) < 0.05) continue;
      picks[r.id] = m > 0 ? (r.main?.dem_party || 'D') : 'R';
    }
    savePicks(); rerenderKeep();
  } else if (b.id === 'call') { countyAll = !countyAll; rerenderKeep(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; rerenderKeep('#q'); }
  if (e.target.id === 'cq') { countyQ = e.target.value; $('#ctable').innerHTML = countyTable(G.turnout); }
});
document.addEventListener('change', e => { if (e.target.id === 'sort') { ui.sort = e.target.value; rerenderKeep('#sort'); } });
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });

function countdown() {
  const days = Math.ceil((ELECTION - Date.now()) / 864e5);
  $('#countdown').textContent = days > 1 ? `Election Day Tue Nov 3 · ${days} days` : days === 1 ? 'Election Day is tomorrow' : days === 0 ? 'Election Day' : 'Election Day: Nov 3';
}
countdown();
Promise.all([fetch('races.json').then(r => r.json()), fetch('ga.json').then(r => r.json()),
             fetch('data/ga_county_pres2024.json').then(r => r.ok ? r.json() : null).catch(() => null), loadLive()])
  .then(([a, b, c]) => {
    R = a; G = b; GAP = c; render();
    // refresh live results every minute; skip a redraw while someone is typing in a search box
    setInterval(async () => { await loadLive(); if (!['INPUT', 'SELECT'].includes(document.activeElement?.tagName)) rerenderKeep(); }, 60000);
  })
  .catch(err => { $('#app').innerHTML = `<p class="loading">Could not load races.json / ga.json (${esc(err.message)}). They must be published next to this page.</p>`; });
})();
</script>
</body>
